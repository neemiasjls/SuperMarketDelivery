services:
  postgres:
    image: postgres:16-alpine
    container_name: braga_banco
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-braga_db}
      POSTGRES_USER: ${POSTGRES_USER:-braga_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - braga_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U braga_user -d braga_db']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  braga_data:
    name: braga_banco_data
